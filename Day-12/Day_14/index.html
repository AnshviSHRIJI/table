<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <div class="page-bg" aria-hidden="true">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
    </div>

    <main class="studio">

      <!-- LEFT: editor form -->
      <aside class="editor" aria-label="Profile editor">

        <header class="editor-header">
          <span class="editor-tag">Studio</span>
          <h1 class="editor-title">Profile Card</h1>
          <p class="editor-sub">Fill in your details and watch the card update live.</p>
        </header>

        <div class="field">
          <label for="full-name">Full Name</label>
          <input
            type="text"
            id="full-name"
            name="full-name"
            placeholder="Alex Rivera"
            maxlength="60"
            autocomplete="off"
          />
        </div>

        <div class="field">
          <label for="role">Role / Tagline</label>
          <input
            type="text"
            id="role"
            name="role"
            placeholder="Product Designer & Dreamer"
            maxlength="80"
            autocomplete="off"
          />
        </div>

        <div class="field">
          <label for="bio">Short Bio</label>
          <textarea
            id="bio"
            name="bio"
            rows="5"
            maxlength="200"
            placeholder="A sentence or two about who you are and what you love doing..."
          ></textarea>
          <!-- Character counter sits BENEATH the textarea, updated by script.js -->
          <span class="char-counter" id="char-counter" aria-live="polite">0 / 200</span>
        </div>

        <div class="field">
          <label for="accent-color">Accent Colour</label>
          <select id="accent-color" name="accent-color">
            <option value="indigo">Indigo</option>
            <option value="emerald">Emerald</option>
            <option value="rose">Rose</option>
            <option value="amber">Amber</option>
          </select>
        </div>

      </aside>

      <!-- RIGHT: live card preview -->
      <section class="stage" aria-label="Card preview">

        <p class="stage-hint" aria-hidden="true">Live Preview</p>

        <article class="card" id="profile-card">
          <div class="card-stripe" aria-hidden="true"></div>

          <div class="card-top">
            <div class="avatar" aria-hidden="true">
              <span id="avatar-initials">?</span>
            </div>
            <div class="card-badge">Open to Work</div>
          </div>

          <div class="card-info">
            <h2 class="card-name" id="card-name">Your Name</h2>
            <p class="card-role" id="card-role">Your Role</p>
          </div>

          <p class="card-bio" id="card-bio">Your bio will appear here as you type.</p>

          <footer class="card-foot">
            <button class="card-cta" type="button">Connect with me</button>
          </footer>
        </article>

      </section>

    </main>

    <script src="script.js"></script>
  </body>
</html>
